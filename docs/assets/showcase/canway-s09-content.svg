<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <title>AI提效从探索走向制度化：AI Code Review、单元测试、实践分享等多条线路取得实质进展</title>
  <desc>Bento布局：左侧深色主卡为唯一焦点，呈现核心方向AI Code Review（研究AI-Codereview-Gitlab原理、双周会分享、持续优化），卡内浅蓝结论条给出制度化小结；右侧四张支撑卡分别承载单元测试（覆盖率目标80%、推动接入流水线质量门禁、4.0接入单元测试流水线）、AI编码实践分享（superpowers、openspec、SDD实践、双周AI尝鲜会）、黑客马拉松参赛、FeaturePilot与工具链（AI开发助手优化、dify部署体验、claude code源码学习），FeaturePilot卡用浅紫表面标注AI工具属性；页头浅蓝证据条给出受众要点。</desc>
  <rect width="1280" height="720" fill="#FFFFFF" />
  <g>
