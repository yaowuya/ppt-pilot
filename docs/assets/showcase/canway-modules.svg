<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <title>自动化底座H1完成从0到1建设，发布1.0版本</title>
  <desc>深色主卡展示自动化底座三层模块架构，8个核心模块均以对勾标注完成状态：用户与组织层（用户管理、标签管理、动态分组），内容与通道层（通道管理、文件库），流程与安全层（审批管理、权限中心对接、审计日志）；卡片右上角蓝色徽标标注1.0已发布。右侧浅蓝卡为H1里程碑（4月发布1.0版本、5月提测），下方白色卡为交付定位结论（底座成为核心客户多租户交付基础）。</desc>
  <rect x="0" y="0" width="1280" height="720" fill="#F6F8FC" />
  <g>
    <text x="1216" y="92" text-anchor="end" font-size="20" font-weight="bold" fill="#B7C3D6"><tspan>05</tspan></text>
    <text x="64" y="104" font-size="40" font-weight="bold" fill="#10233F"><tspan>自动化底座 H1 完成从 0 到 1 建设，发布 1.0 版本</tspan></text>
    <text x="64" y="142" font-size="20" fill="#5A6B85"><tspan>为后续 4.x 版本和定制化交付奠定基础</tspan></text>
  </g>
  <g>
    <path d="M84,176 H804 A20,20 0 0 1 824,196 V636 A20,20 0 0 1 804,656 H84 A20,20 0 0 1 64,636 V196 A20,20 0 0 1 84,176 Z" fill="#10233F" />
    <text x="88" y="230" font-size="24" font-weight="bold" fill="#FFFFFF"><tspan>自动化底座</tspan></text>
    <text x="232" y="228" font-size="16" fill="#65B7F9"><tspan>H1 · 从 0 到 1 建设</tspan></text>
    <path d="M690,200 H786 A14,14 0 0 1 800,214 V218 A14,14 0 0 1 786,232 H690 A14,14 0 0 1 676,218 V214 A14,14 0 0 1 690,200 Z" fill="#156BFF" />
    <text x="738" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF"><tspan>1.0 已发布</tspan></text>
    <g>
      <rect x="88" y="268" width="6" height="6" fill="#65B7F9" /><text x="102" y="280" font-size="16" font-weight="bold" fill="#65B7F9"><tspan>用户与组织</tspan></text>
