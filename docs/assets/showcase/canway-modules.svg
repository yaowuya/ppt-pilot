    <line x1="886" y1="290" x2="886" y2="344" stroke="#65B7F9" stroke-width="2" />
    <circle cx="886" cy="352" r="6" fill="#FFFFFF" stroke="#156BFF" stroke-width="1.2" /><text x="904" y="361" font-size="24" font-weight="bold" fill="#10233F"><tspan>5月</tspan></text><text x="962" y="361" font-size="20" fill="#5A6B85"><tspan>提测</tspan></text>
  </g>
