    <text x="928" y="490" font-size="14" fill="#5A6B85"><tspan>交付定位</tspan></text>
    <text x="872" y="552" font-size="24" font-weight="bold" fill="#156BFF"><tspan>底座成为核心客户</tspan></text>
    <text x="872" y="590" font-size="24" font-weight="bold" fill="#156BFF"><tspan>多租户交付基础</tspan></text>
