      <circle cx="114" cy="546" r="11" fill="#EAF3FF" /><circle cx="359" cy="546" r="11" fill="#EAF3FF" /><circle cx="604" cy="546" r="11" fill="#EAF3FF" />
      <polyline points="109,546 112.5,550 119,538" fill="none" stroke="#156BFF" stroke-width="2.2" />
      <polyline points="354,546 357.5,550 364,538" fill="none" stroke="#156BFF" stroke-width="2.2" />
      <polyline points="599,546 602.5,550 609,538" fill="none" stroke="#156BFF" stroke-width="2.2" />
      <text x="136" y="553" font-size="20" font-weight="bold" fill="#10233F"><tspan>审批管理</tspan></text><text x="381" y="553" font-size="20" font-weight="bold" fill="#10233F"><tspan>权限中心对接</tspan></text><text x="626" y="553" font-size="20" font-weight="bold" fill="#10233F"><tspan>审计日志</tspan></text>
    </g>
    <polyline points="90,610 94,614 101,605" fill="none" stroke="#65B7F9" stroke-width="2" />
    <text x="110" y="616" font-size="14" fill="#9FB3D1"><tspan>8 个模块均为核心 · H1 已完成建设</tspan></text>
  </g>
  <g>
    <path d="M868,176 H1196 A20,20 0 0 1 1216,196 V396 A20,20 0 0 1 1196,416 H868 A20,20 0 0 1 848,396 V196 A20,20 0 0 1 868,176 Z" fill="#EAF3FF" />
