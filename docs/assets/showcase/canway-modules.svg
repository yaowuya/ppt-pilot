      <polyline points="599,322 602.5,326 609,318" fill="none" stroke="#156BFF" stroke-width="2.2" />
      <text x="136" y="329" font-size="20" font-weight="bold" fill="#10233F"><tspan>用户管理</tspan></text><text x="381" y="329" font-size="20" font-weight="bold" fill="#10233F"><tspan>标签管理</tspan></text><text x="626" y="329" font-size="20" font-weight="bold" fill="#10233F"><tspan>动态分组</tspan></text>
