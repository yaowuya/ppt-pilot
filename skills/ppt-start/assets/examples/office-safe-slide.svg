<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="s01-a11y-title s01-a11y-desc">
  <title id="s01-a11y-title">A strict content gate prevents unsupported claims from reaching slide design</title>
  <desc id="s01-a11y-desc">A two-column slide contrasts a reviewed manuscript with a production-ready SVG outcome.</desc>
  <rect id="s01-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text id="s01-title" x="64" y="112" font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="48" font-weight="700" fill="#17212B" data-role="title">
    <tspan x="64" dy="0">Independent review turns evidence into</tspan>
    <tspan x="64" dy="58">production-ready slide decisions</tspan>
  </text>

  <g id="s01-review-card">
    <rect id="s01-review-card-bg" x="64" y="232" width="520" height="330" rx="12" fill="#F2F6F8" stroke="#D8E7ED" stroke-width="2"/>
    <circle id="s01-review-icon-bg" cx="116" cy="286" r="24" fill="#163B52"/>
    <path id="s01-review-icon" d="M104 286 L112 294 L129 276" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text id="s01-review-heading" x="158" y="294" font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#17212B" data-role="body">
      <tspan x="158" dy="0">Manuscript approved</tspan>
    </text>
    <text id="s01-review-copy" x="104" y="362" font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" fill="#394754" data-role="body">
      <tspan x="104" dy="0">Claims map to dated sources.</tspan>
      <tspan x="104" dy="38">Blocking findings are RESOLVED.</tspan>
      <tspan x="104" dy="38">Reviewer provenance remains traceable.</tspan>
    </text>
  </g>

  <line id="s01-flow-line" x1="608" y1="398" x2="672" y2="398" stroke="#E06B45" stroke-width="4"/>
  <polygon id="s01-flow-arrow" points="672,398 654,388 654,408" fill="#E06B45"/>

  <g id="s01-output-card" data-source-id="SRC-001">
    <rect id="s01-output-card-bg" x="696" y="232" width="520" height="330" rx="12" fill="#163B52"/>
    <text id="s01-output-stat" x="736" y="322" font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" data-role="body">
      <tspan x="736" dy="0">1280 × 720</tspan>
    </text>
    <text id="s01-output-copy" x="736" y="388" font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" fill="#D8E7ED" data-role="body">
      <tspan x="736" dy="0">Standalone UTF-8 SVG</tspan>
      <tspan x="736" dy="38">Office-safe vector subset</tspan>
      <tspan x="736" dy="38">Explicit text wrapping and source IDs</tspan>
    </text>
  </g>

  <text id="s01-delivery-note" x="64" y="648" font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="400" fill="#5E6B76" data-role="footnote">
    <tspan x="64" dy="0">Editable vector delivery · trace metadata retained</tspan>
  </text>
</svg>
